services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: factory_demo
      POSTGRES_USER: factory_demo
      POSTGRES_PASSWORD: factory_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
